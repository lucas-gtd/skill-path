[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-path"
version = "0.1.0"
description = "Evaluate a CV PDF against roadmap JSON files with LangChain, OpenRouter and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "pydantic>=2.10.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
  "rank-bm25>=0.2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
skill-path = "skill_path.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
